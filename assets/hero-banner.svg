<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" fill="none" role="img" aria-label="Krishna Chaitanya — AI &amp; Embodied Systems Engineer">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#080E1C" />
      <stop offset="85%" stop-color="#0D0B1C" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E0F7FA" />
      <stop offset="60%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Accent Neon Cyan to Purple -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Grid Fade Gradient -->
    <linearGradient id="gridFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- Horizon Line Gradient -->
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Corner Reticle Symbol -->
    <g id="reticle">
      <path d="M0 0 L14 0 M0 0 L0 14" stroke="#00F2FE" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Orbit Ring Animation -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0.6; }
        50% { opacity: 0.9; }
        100% { transform: translateY(440px); opacity: 0.1; }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 1; r: 3.5; }
        50% { opacity: 0.3; r: 2; }
      }
      .beacon-dot {
        animation: blinkBeacon 2.2s ease-in-out infinite;
      }
      .gyro-orbit {
        transform-origin: 980px 210px;
      }
      .floating-core {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: 980px 210px;
      }
    </style>
  </defs>

  <!-- Deep Canvas Frame -->
  <rect width="1200" height="440" rx="20" fill="url(#deepBg)" />
  <rect width="1200" height="440" rx="20" stroke="#1E293B" stroke-width="1.2" />

  <!-- 3D Perspective Grid (Floor) -->
  <g opacity="0.75" mask="url(#gridFade)">
    <!-- Perspective Converging Lines (Vanishing toward 980, 240) -->
    <path d="M0 440 L980 260" stroke="#00F2FE" stroke-width="0.75" opacity="0.25" />
    <path d="M120 440 L980 260" stroke="#00F2FE" stroke-width="0.75" opacity="0.3" />
    <path d="M240 440 L980 260" stroke="#00F2FE" stroke-width="0.75" opacity="0.35" />
    <path d="M380 440 L980 260" stroke="#00F2FE" stroke-width="0.75" opacity="0.4" />
    <path d="M540 440 L980 260" stroke="#00F2FE" stroke-width="0.75" opacity="0.45" />
    <path d="M720 440 L980 260" stroke="#38BDF8" stroke-width="0.8" opacity="0.5" />
    <path d="M900 440 L980 260" stroke="#38BDF8" stroke-width="0.8" opacity="0.55" />
    <path d="M1060 440 L980 260" stroke="#8B5CF6" stroke-width="0.8" opacity="0.5" />
    <path d="M1180 440 L980 260" stroke="#8B5CF6" stroke-width="0.75" opacity="0.4" />

    <!-- Isometric Transverse Horizon Lines -->
    <path d="M0 430 Q 600 425 1200 430" stroke="#00F2FE" stroke-width="1" opacity="0.3" />
    <path d="M40 380 Q 600 375 1200 380" stroke="#00F2FE" stroke-width="0.9" opacity="0.25" />
    <path d="M80 340 Q 600 336 1200 340" stroke="#38BDF8" stroke-width="0.8" opacity="0.22" />
    <path d="M120 310 Q 600 307 1200 310" stroke="#38BDF8" stroke-width="0.7" opacity="0.18" />
    <path d="M160 286 Q 600 284 1200 286" stroke="#8B5CF6" stroke-width="0.6" opacity="0.15" />
    <path d="M200 270 Q 600 269 1200 270" stroke="#8B5CF6" stroke-width="0.5" opacity="0.12" />
  </g>

  <!-- Glowing Horizon Line -->
  <line x1="40" y1="265" x2="1160" y2="265" stroke="url(#horizonGrad)" stroke-width="1.6" filter="url(#glowSubtle)" />

  <!-- Ambient Plasma Cloud behind 3D Graphic -->
  <circle cx="980" cy="210" r="140" fill="#00F2FE" opacity="0.08" filter="url(#glowCyan)" />
  <circle cx="950" cy="230" r="110" fill="#8B5CF6" opacity="0.09" filter="url(#glowCyan)" />

  <!-- 3D CYBERNETIC GYROSCOPE & NEURAL EMBODIMENT APPARATUS -->
  <g class="floating-core">
    <!-- Outer Orbital Ring 1 (Tilted X/Y) -->
    <ellipse cx="980" cy="210" rx="160" ry="65" transform="rotate(-30 980 210)" stroke="#00F2FE" stroke-width="1.6" stroke-dasharray="14 8 4 8" opacity="0.75" class="gyro-orbit">
      <animateTransform attributeName="transform" type="rotate" from="-30 980 210" to="330 980 210" dur="24s" repeatCount="indefinite" />
    </ellipse>

    <!-- Outer Orbital Ring 2 (Tilted Opposite) -->
    <ellipse cx="980" cy="210" rx="145" ry="55" transform="rotate(45 980 210)" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="10 6 2 6" opacity="0.8" class="gyro-orbit">
      <animateTransform attributeName="transform" type="rotate" from="45 980 210" to="-315 980 210" dur="18s" repeatCount="indefinite" />
    </ellipse>

    <!-- Mid Polar Orbit (Vertical Gyro) -->
    <ellipse cx="980" cy="210" rx="120" ry="120" transform="rotate(75 980 210)" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="75 980 210" to="435 980 210" dur="30s" repeatCount="indefinite" />
    </ellipse>

    <!-- 3D Isometric Icosahedron / Octahedron Nodes -->
    <!-- Central Polyhedron Edges -->
    <g stroke="url(#neonCyanPurple)" stroke-width="1.5" opacity="0.85">
      <!-- Top Apex to Equatorial Ring -->
      <line x1="980" y1="140" x2="920" y2="195" />
      <line x1="980" y1="140" x2="1040" y2="195" />
      <line x1="980" y1="140" x2="980" y2="235" />
      <line x1="980" y1="140" x2="950" y2="175" stroke-dasharray="3 3" opacity="0.5" />
      <line x1="980" y1="140" x2="1010" y2="175" stroke-dasharray="3 3" opacity="0.5" />

      <!-- Equatorial Cross Links -->
      <polygon points="920,195 980,235 1040,195 1010,175 950,175" fill="#00F2FE" fill-opacity="0.06" />

      <!-- Bottom Apex to Equatorial Ring -->
      <line x1="980" y1="280" x2="920" y2="195" />
      <line x1="980" y1="280" x2="1040" y2="195" />
      <line x1="980" y1="280" x2="980" y2="235" />
      <line x1="980" y1="280" x2="950" y2="175" stroke-dasharray="3 3" opacity="0.4" />
      <line x1="980" y1="280" x2="1010" y2="175" stroke-dasharray="3 3" opacity="0.4" />
    </g>

    <!-- Glowing Vertex Spheres -->
    <circle cx="980" cy="140" r="5" fill="#00F2FE" filter="url(#glowSubtle)" />
    <circle cx="980" cy="280" r="5" fill="#8B5CF6" filter="url(#glowSubtle)" />
    <circle cx="920" cy="195" r="4.5" fill="#38BDF8" />
    <circle cx="1040" cy="195" r="4.5" fill="#38BDF8" />
    <circle cx="980" cy="235" r="5.5" fill="#00F2FE" filter="url(#glowSubtle)" />
    <circle cx="950" cy="175" r="3" fill="#A78BFA" opacity="0.8" />
    <circle cx="1010" cy="175" r="3" fill="#A78BFA" opacity="0.8" />

    <!-- Core Fusion Reactor (Pulsing Center) -->
    <circle cx="980" cy="210" r="16" fill="#00F2FE" fill-opacity="0.25" filter="url(#glowCyan)" />
    <circle cx="980" cy="210" r="7" fill="#FFFFFF">
      <animate attributeName="r" values="6;8.5;6" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Satellite Nodes on Orbit 1 -->
    <g>
      <circle cx="1120" cy="180" r="3.5" fill="#00F2FE" filter="url(#glowSubtle)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="840" cy="240" r="3" fill="#8B5CF6" />
    </g>

    <!-- Autonomous Agent Constellation (Neural Links) -->
    <g stroke="#38BDF8" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 4">
      <line x1="980" y1="140" x2="890" y2="110" />
      <line x1="920" y1="195" x2="840" y2="160" />
      <line x1="980" y1="280" x2="900" y2="330" />
      <line x1="1040" y1="195" x2="1110" y2="140" />
      <line x1="980" y1="235" x2="1080" y2="290" />
    </g>

    <circle cx="890" cy="110" r="3" fill="#00F2FE" />
    <circle cx="840" cy="160" r="2.5" fill="#38BDF8" />
    <circle cx="900" cy="330" r="3" fill="#8B5CF6" />
    <circle cx="1110" cy="140" r="2.5" fill="#00F2FE" />
    <circle cx="1080" cy="290" r="3" fill="#38BDF8" />

    <!-- Subsystem Label Chips Floating in 3D -->
    <g font-family="'SF Pro Display', -apple-system, 'Segoe UI', monospace" font-size="9" letter-spacing="1">
      <rect x="830" y="98" width="65" height="16" rx="4" fill="#090E17" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="0.8" />
      <text x="836" y="110" fill="#00F2FE">PPO SWARM</text>

      <rect x="1058" y="128" width="58" height="16" rx="4" fill="#090E17" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="0.8" />
      <text x="1064" y="140" fill="#38BDF8">GENESIS</text>

      <rect x="850" y="322" width="62" height="16" rx="4" fill="#090E17" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="0.8" />
      <text x="856" y="334" fill="#C4B5FD">AIR-GAP AI</text>
    </g>
  </g>

  <!-- HUD Reticles in Corners -->
  <use href="#reticle" x="24" y="24" />
  <use href="#reticle" x="1176" y="24" transform="scale(-1, 1) translate(-1200, 0)" />
  <use href="#reticle" x="24" y="416" transform="scale(1, -1) translate(0, -440)" />
  <use href="#reticle" x="1176" y="416" transform="scale(-1, -1) translate(-1200, -440)" />

  <!-- LEFT HERO TYPOGRAPHY & IDENTITY -->
  <!-- Top Telemetry & Status Bar -->
  <g font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="11" letter-spacing="1.5">
    <!-- Live Status Pill -->
    <rect x="52" y="42" width="225" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="68" cy="55" r="4" fill="#10B981" class="beacon-dot" />
    <circle cx="68" cy="55" r="7" stroke="#10B981" stroke-width="1" opacity="0.4" />
    <text x="82" y="59" fill="#00F2FE" font-weight="600">SYSTEM ARCHITECTURE</text>
    <text x="228" y="59" fill="#64748B" font-size="9">v2.6</text>

    <!-- Location & Sub-telemetry -->
    <text x="300" y="59" fill="#64748B" letter-spacing="2">// BLR · SCALER &amp; BITS CS</text>
  </g>

  <!-- Domain Identifier Tag -->
  <g font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="12" letter-spacing="2.8">
    <text x="54" y="112" fill="#38BDF8" font-weight="600">RESEARCH · EMBODIED AI · AGENT SYSTEMS</text>
  </g>

  <!-- Main Candidate Name (Bold, Majestic, High Visual Impact) -->
  <text x="50" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" letter-spacing="-2.2" fill="url(#textGrad)">
    Krishna Chaitanya
  </text>

  <!-- High-Precision Sub-headline / Mission -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" letter-spacing="-0.2">
    <text x="54" y="218" fill="#F1F5F9" font-weight="500">
      Engineering autonomous robot swarms, local-first LLM workbenches &amp; 3D simulations.
    </text>
    <text x="54" y="244" fill="#94A3B8" font-size="15" font-weight="400">
      Trained PPO multi-agent coordination in Genesis · Unitree G1 LfD in MuJoCo · Air-gapped on-premise AI.
    </text>
  </g>

  <!-- Cybernetic Metric Badges / HUD Chips (Bottom Deck) -->
  <g transform="translate(52, 340)">
    <!-- Badge 1: Multi-Agent RL -->
    <g transform="translate(0, 0)">
      <rect width="180" height="52" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="1.2" />
      <rect width="3" height="24" x="0" y="14" fill="#00F2FE" rx="1.5" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00F2FE" letter-spacing="1.2">ROBOTICS SIM</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Genesis &amp; MuJoCo</text>
    </g>

    <!-- Badge 2: Local Intelligence -->
    <g transform="translate(192, 0)">
      <rect width="180" height="52" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="1.2" />
      <rect width="3" height="24" x="0" y="14" fill="#38BDF8" rx="1.5" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8" letter-spacing="1.2">AIR-GAP WORKBENCH</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Local Multimodal RAG</text>
    </g>

    <!-- Badge 3: Spatial Computing & Core -->
    <g transform="translate(384, 0)">
      <rect width="180" height="52" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="1.2" />
      <rect width="3" height="24" x="0" y="14" fill="#8B5CF6" rx="1.5" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A78BFA" letter-spacing="1.2">INTERACTIVE 3D</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Three.js &amp; C++ Shell</text>
    </g>

    <!-- Live Telemetry Tag -->
    <g transform="translate(580, 16)" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.5">
      <text x="0" y="14" fill="#64748B">BENCHMARK // <tspan fill="#10B981">0.547m DROP ZONE ACCURACY</tspan></text>
      <text x="0" y="29" fill="#475569">4/4 DETERMINISTIC RUNS COMPLETE</text>
    </g>
  </g>

  <!-- Top Right HUD Coordinates -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" letter-spacing="1.5" text-anchor="end">
    <text x="1160" y="46">NODE: SAICHAITU2012</text>
    <text x="1160" y="60">SECURITY: STRICT AIR-GAP</text>
    <text x="1160" y="74">SIM_FPS: 60.0 (DETERMINISTIC)</text>
  </g>
</svg>
