<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Sovereign Agentic AI Workbench — air-gapped local inference">
  <defs>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F2A"/><stop offset="1" stop-color="#123049"/>
    </linearGradient>
    <radialGradient id="sg3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="360" fill="url(#s3)"/>
  <g fill="#EAF2FF">
    <circle cx="100" cy="50" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="42" r="1.1" opacity="0.6"/>
    <circle cx="640" cy="66" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="40" y="58" font-family="Menlo, Consolas, monospace" font-size="14" fill="#34D399" letter-spacing="2">SIH26117 · CONFIDENTIAL COMPUTE</text>

  <circle cx="400" cy="190" r="130" fill="url(#sg3)"/>

  <!-- air-gap ring -->
  <circle cx="400" cy="190" r="118" fill="none" stroke="#34D399" stroke-opacity="0.65" stroke-width="2.5" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- shield -->
  <path d="M400 106 l 44 18 v 34 c 0 30 -22 46 -44 54 c -22 -8 -44 -24 -44 -54 v -34 z" fill="#0B1026" stroke="#34D399" stroke-width="3.5"/>
  <rect x="388" y="162" width="24" height="18" rx="3" fill="#34D399"/>
  <path d="M392 162 v -10 a 8 8 0 0 1 16 0 v 10" fill="none" stroke="#34D399" stroke-width="3"/>
  <g stroke="#34D399" stroke-opacity="0.6" stroke-width="1.6">
    <line x1="400" y1="124" x2="400" y2="106"/><line x1="428" y1="132" x2="440" y2="118"/>
    <line x1="372" y1="132" x2="360" y2="118"/><line x1="444" y1="180" x2="462" y2="186"/>
    <line x1="356" y1="180" x2="338" y2="186"/>
  </g>

  <!-- local model chips -->
  <g font-family="Menlo, Consolas, monospace" font-size="12">
    <rect x="130" y="120" rx="7" width="128" height="34" fill="#22D3EE" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.7"/>
    <text x="142" y="142" fill="#67E8F9">qwen 2.5 · 7b</text>
    <rect x="130" y="166" rx="7" width="128" height="34" fill="#22D3EE" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.7"/>
    <text x="142" y="188" fill="#67E8F9">llama · local rag</text>
    <rect x="540" y="120" rx="7" width="130" height="34" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.75"/>
    <text x="552" y="142" fill="#B39DFF">vector store</text>
    <rect x="540" y="166" rx="7" width="130" height="34" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.75"/>
    <text x="552" y="188" fill="#B39DFF">tools · fastapi</text>
  </g>
  <line x1="258" y1="150" x2="352" y2="182" stroke="#67E8F9" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="540" y1="150" x2="448" y2="182" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- blocked cloud -->
  <g opacity="0.8">
    <ellipse cx="648" cy="66" rx="34" ry="14" fill="#1E2A4A"/>
    <ellipse cx="630" cy="58" rx="16" ry="10" fill="#1E2A4A"/>
    <ellipse cx="662" cy="58" rx="14" ry="9" fill="#1E2A4A"/>
    <line x1="614" y1="84" x2="682" y2="48" stroke="#F66" stroke-width="3">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <text x="700" y="70" font-family="Menlo, Consolas, monospace" font-size="12" fill="#F66">no cloud</text>
  </g>

  <text x="40" y="345" font-family="Menlo, Consolas, monospace" font-size="15" fill="#F6F3FF" letter-spacing="1">SOVEREIGN WORKBENCH <tspan fill="#7E8CC0" font-size="12.5">— air-gap ring · outbound 0 bytes · open-weight llms · mrpl</tspan></text>
</svg>
