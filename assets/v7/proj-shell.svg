<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Custom POSIX shell in C++ — pipelines, fork/exec, signals">
  <defs>
    <linearGradient id="s6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F2A"/><stop offset="1" stop-color="#301845"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#s6)"/>
  <g fill="#EAF2FF">
    <circle cx="130" cy="54" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="44" r="1.2" opacity="0.6"/>
    <circle cx="700" cy="80" r="1.3"><animate attributeName="opacity" values="1;0.35;1" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="40" y="58" font-family="Menlo, Consolas, monospace" font-size="14" fill="#EC4899" letter-spacing="2">C++17 · POSIX SYSCALLS · CODECRAFTERS</text>

  <!-- terminal window -->
  <g>
    <rect x="90" y="96" width="420" height="200" rx="12" fill="#0B1026" stroke="#EC4899" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="90" y="96" width="420" height="34" rx="12" fill="#131A3E"/>
    <circle cx="114" cy="113" r="6" fill="#F66"/>
    <circle cx="136" cy="113" r="6" fill="#FC5"/>
    <circle cx="158" cy="113" r="6" fill="#3C6"/>
    <text x="300" y="118" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8FA0C8">ksh — 0% cloud, 100% syscalls</text>
    <g font-family="Menlo, Consolas, monospace" font-size="14">
      <text x="112" y="158" fill="#34D399">$</text><text x="128" y="158" fill="#EAF2FF">cat manifesto.md | grep build</text>
      <text x="112" y="186" fill="#34D399">$</text><text x="128" y="186" fill="#EAF2FF">./shell &lt; input &gt; output 2&gt; err</text>
      <text x="112" y="214" fill="#34D399">$</text><text x="128" y="214" fill="#EAF2FF">jobs</text>
      <text x="140" y="240" fill="#8FA0C8">[1] fork/exec pid=4107 running</text>
      <text x="112" y="270" fill="#34D399">$</text><rect x="128" y="258" width="10" height="16" fill="#67E8F9">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- fork/exec tree -->
  <g stroke="#EC4899" stroke-opacity="0.75" stroke-width="2" fill="none">
    <line x1="560" y1="130" x2="560" y2="160"/>
    <line x1="560" y1="160" x2="510" y2="196"/>
    <line x1="560" y1="160" x2="610" y2="196"/>
    <line x1="510" y1="196" x2="470" y2="236"/>
    <line x1="510" y1="196" x2="550" y2="236"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5" text-anchor="middle">
    <rect x="524" y="106" rx="6" width="72" height="26" fill="#EC4899" fill-opacity="0.12" stroke="#EC4899" stroke-opacity="0.8"/>
    <text x="560" y="123" fill="#F9A8D4">shell</text>
    <rect x="478" y="168" rx="6" width="64" height="26" fill="#22D3EE" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.7"/>
    <text x="510" y="185" fill="#67E8F9">fork</text>
    <rect x="578" y="168" rx="6" width="64" height="26" fill="#22D3EE" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.7"/>
    <text x="610" y="185" fill="#67E8F9">exec</text>
    <rect x="436" y="238" rx="6" width="68" height="26" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.75"/>
    <text x="470" y="255" fill="#B39DFF">pipe|</text>
    <rect x="518" y="238" rx="6" width="64" height="26" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.75"/>
    <text x="550" y="255" fill="#B39DFF">sig&gt;</text>
  </g>
  <circle r="4" fill="#F6F3FF">
    <animateMotion path="M560 130 L560 160 L510 196 L470 236" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <text x="40" y="345" font-family="Menlo, Consolas, monospace" font-size="15" fill="#F6F3FF" letter-spacing="1">POSIX SHELL <tspan fill="#7E8CC0" font-size="12.5">— tokenizer · ast · pipelines · signal handling, from scratch</tspan></text>
</svg>
