<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="MultiBot-PPO — heterogeneous swarm pushing crates to a delivery zone">
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F2A"/><stop offset="1" stop-color="#1E2354"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#s1)"/>
  <g fill="#EAF2FF">
    <circle cx="90" cy="52" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="620" cy="66" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="120" r="1.1" opacity="0.6"/>
  </g>
  <circle cx="672" cy="70" r="46" fill="#F6F3FF" opacity="0.95"/>
  <circle cx="660" cy="60" r="7" fill="#DCD6F7" opacity="0.5"/>
  <circle cx="684" cy="80" r="5" fill="#DCD6F7" opacity="0.45"/>

  <text x="40" y="58" font-family="Menlo, Consolas, monospace" font-size="14" fill="#67E8F9" letter-spacing="2">GENESIS WORLD · RL SWARM</text>

  <!-- warehouse floor -->
  <path d="M0 250 L800 250 L800 360 L0 360 Z" fill="#0D1230"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#67E8F9" stroke-opacity="0.3" stroke-width="2"/>
  <g stroke="#67E8F9" stroke-opacity="0.12">
    <line x1="120" y1="250" x2="40" y2="360"/><line x1="320" y1="250" x2="280" y2="360"/>
    <line x1="520" y1="250" x2="520" y2="360"/><line x1="700" y1="250" x2="760" y2="360"/>
    <line x1="0" y1="292" x2="800" y2="292"/><line x1="0" y1="326" x2="800" y2="326"/>
  </g>

  <!-- delivery zone -->
  <rect x="560" y="262" width="150" height="54" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-width="2.5" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="635" y="296" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#34D399" letter-spacing="2">DELIVERY</text>

  <!-- crate being pushed -->
  <rect x="470" y="276" width="44" height="40" rx="4" fill="#2A2F63" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="492" y="301" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#B39DFF">7kg</text>
  <line x1="442" y1="298" x2="462" y2="298" stroke="#67E8F9" stroke-width="2.5" marker-end="none"/>
  <path d="M454 290 l 10 8 -10 8" fill="none" stroke="#67E8F9" stroke-width="2.5"/>

  <!-- two rovers -->
  <g>
    <rect x="392" y="290" width="50" height="26" rx="7" fill="#151A3E" stroke="#67E8F9" stroke-width="2"/>
    <circle cx="404" cy="320" r="7" fill="#0A0F2A" stroke="#67E8F9" stroke-width="2"/>
    <circle cx="430" cy="320" r="7" fill="#0A0F2A" stroke="#67E8F9" stroke-width="2"/>
    <circle cx="417" cy="300" r="3" fill="#67E8F9"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <rect x="392" y="252" width="46" height="26" rx="6" fill="#151A3E" stroke="#F9A8D4" stroke-width="2"/>
    <circle cx="402" cy="282" r="7" fill="#0A0F2A" stroke="#F9A8D4" stroke-width="2"/>
    <circle cx="428" cy="282" r="7" fill="#0A0F2A" stroke="#F9A8D4" stroke-width="2"/>
    <circle cx="415" cy="263" r="3" fill="#F9A8D4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- LLM commander chip -->
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <rect x="60" y="120" rx="8" width="212" height="60" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.8"/>
    <text x="76" y="146" fill="#B39DFF">&gt; commander: qwen2.5</text>
    <text x="76" y="166" fill="#C7D2FE" font-size="12">task: push crates → zone</text>
  </g>
  <line x1="272" y1="150" x2="400" y2="240" stroke="#67E8F9" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 5"/>

  <text x="40" y="345" font-family="Menlo, Consolas, monospace" font-size="15" fill="#F6F3FF" letter-spacing="1">MULTIBOT-PPO <tspan fill="#7E8CC0" font-size="12.5">— 2/2 packages delivered · drop 0.549 m vs 0.55 m zone</tspan></text>
</svg>
