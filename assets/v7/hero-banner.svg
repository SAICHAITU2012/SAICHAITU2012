<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-label="Krishna Chaitanya — Celestial Laboratory developer universe with holographic grid floor and wireframe globe projection">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081C"/>
      <stop offset="0.45" stop-color="#0D1436"/>
      <stop offset="0.78" stop-color="#1B2050"/>
      <stop offset="1" stop-color="#2A2C68"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9BFFF" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#9D8FFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9D8FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonHaze" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#E8A9D8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E8A9D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DCE4FF"/>
      <stop offset="1" stop-color="#A9B8F5"/>
    </linearGradient>
    <linearGradient id="holoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="gridHorizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#67E8F9" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#F9C4E0" stop-opacity="0.95"/>
      <stop offset="0.75" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="atmo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- ══ sky ══ -->
  <rect width="1600" height="520" fill="url(#sky)"/>
  <rect y="300" width="1600" height="220" fill="url(#horizonHaze)"/>

  <!-- ══ stars ══ -->
  <g fill="#EAF2FF">
    <circle cx="90" cy="60" r="1.4"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="140" r="1.1" opacity="0.7"/>
    <circle cx="260" cy="46" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="200" r="1" opacity="0.55"/>
    <circle cx="410" cy="90" r="1.3" opacity="0.8"/>
    <circle cx="470" cy="160" r="1" opacity="0.5"/>
    <circle cx="530" cy="40" r="1.5"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="120" r="1.1" opacity="0.65"/>
    <circle cx="660" cy="70" r="1.4" opacity="0.85"/>
    <circle cx="720" cy="180" r="1" opacity="0.5"/>
    <circle cx="790" cy="60" r="1.5"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="220" r="1" opacity="0.5"/>
    <circle cx="910" cy="100" r="1.2" opacity="0.75"/>
    <circle cx="980" cy="40" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="170" r="1" opacity="0.55"/>
    <circle cx="60" cy="240" r="1.2" opacity="0.6"/>
    <circle cx="150" cy="300" r="1" opacity="0.45"/>
    <circle cx="1180" cy="70" r="1.2" opacity="0.7"/>
    <circle cx="1440" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="1520" cy="130" r="1.1" opacity="0.6"/>
    <circle cx="1550" cy="250" r="1.2"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#7DE3F7">
    <circle cx="220" cy="90" r="1.8" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="150" r="1.6" opacity="0.8"/>
    <circle cx="880" cy="150" r="1.7"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="130" r="1.5" opacity="0.75"/>
    <circle cx="1480" cy="180" r="1.6" opacity="0.8"/>
    <circle cx="330" cy="290" r="1.3" opacity="0.6"/>
  </g>
  <g fill="#F9C4E0">
    <circle cx="300" cy="130" r="1.6" opacity="0.8"/>
    <circle cx="760" cy="110" r="1.5"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="90" r="1.6" opacity="0.85"/>
    <circle cx="480" cy="250" r="1.2" opacity="0.55"/>
  </g>

  <!-- ══ shooting stars ══ -->
  <g opacity="0">
    <line x1="0" y1="0" x2="150" y2="52" stroke="url(#shoot)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="52" r="2.2" fill="#FFFFFF"/>
    <animateTransform attributeName="transform" type="translate" values="80 40;560 236;560 236" keyTimes="0;0.14;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.02;0.14;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="120" y2="44" stroke="url(#shoot)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="44" r="2" fill="#FFFFFF"/>
    <animateTransform attributeName="transform" type="translate" values="1520 90;1180 230;1180 230" keyTimes="0;0.12;1" dur="12s" begin="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.02;0.12;1" dur="12s" begin="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- ══ moon ══ -->
  <circle cx="1250" cy="150" r="185" fill="url(#moonGlow)">
    <animate attributeName="r" values="185;200;185" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1250" cy="150" r="96" fill="#F6F3FF"/>
  <circle cx="1222" cy="120" r="14" fill="#DCD6F7" opacity="0.6"/>
  <circle cx="1284" cy="170" r="10" fill="#DCD6F7" opacity="0.5"/>
  <circle cx="1258" cy="196" r="7" fill="#DCD6F7" opacity="0.45"/>
  <circle cx="1210" cy="172" r="6" fill="#DCD6F7" opacity="0.4"/>
  <circle cx="1292" cy="122" r="5" fill="#DCD6F7" opacity="0.45"/>

  <!-- ══ drifting clouds ══ -->
  <g fill="#C7D2FE" opacity="0.10">
    <ellipse cx="380" cy="170" rx="190" ry="26"/>
    <ellipse cx="520" cy="186" rx="150" ry="20"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;90 0;0 0" dur="90s" repeatCount="indefinite"/>
  </g>
  <g fill="#C7D2FE" opacity="0.08">
    <ellipse cx="1000" cy="240" rx="230" ry="24"/>
    <ellipse cx="860" cy="256" rx="160" ry="18"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-110 0;0 0" dur="110s" repeatCount="indefinite"/>
  </g>
  <g fill="#E8A9D8" opacity="0.07">
    <ellipse cx="1330" cy="290" rx="220" ry="22"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;70 0;0 0" dur="130s" repeatCount="indefinite"/>
  </g>

  <!-- ══ holo panels (extruded for depth) ══ -->
  <g font-family="Menlo, Consolas, monospace" font-size="15">
    <g>
      <rect x="705" y="91" width="252" height="64" rx="8" fill="#040810" opacity="0.85"/>
      <rect x="700" y="86" width="252" height="64" rx="8" fill="#22D3EE" fill-opacity="0.07" stroke="url(#holoStroke)" stroke-opacity="0.75"/>
      <text x="716" y="112" fill="#67E8F9" opacity="0.95">&gt; whoami</text>
      <text x="716" y="134" fill="#C7D2FE">krishna.chaitanya — scaler · bits pilani</text>
    </g>
    <g>
      <rect x="957" y="181" width="200" height="64" rx="8" fill="#040810" opacity="0.85"/>
      <rect x="952" y="176" width="200" height="64" rx="8" fill="#8B5CF6" fill-opacity="0.08" stroke="url(#holoStroke)" stroke-opacity="0.75"/>
      <text x="968" y="202" fill="#B39DFF">&gt; active_sim</text>
      <text x="968" y="224" fill="#C7D2FE">mujoco · genesis</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="137" y="123" width="220" height="52" rx="8" fill="#040810" opacity="0.85"/>
      <rect x="132" y="118" width="220" height="52" rx="8" fill="#22D3EE" fill-opacity="0.06" stroke="url(#holoStroke)" stroke-opacity="0.6"/>
      <text x="148" y="142" fill="#67E8F9">&gt; status</text>
      <text x="148" y="160" fill="#C7D2FE" font-size="13">building · learning · simulating</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="7.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ══ hills (far layer atmospherically blurred) ══ -->
  <g filter="url(#atmo)">
    <path d="M0 388 Q 240 348 480 384 T 960 388 T 1440 380 L 1600 388 L 1600 440 L 0 440 Z" fill="#151C46"/>
  </g>
  <path d="M0 420 Q 300 382 640 416 T 1240 414 T 1600 420 L 1600 440 L 0 440 Z" fill="#0F1538"/>

  <!-- torii gate on left hill -->
  <g fill="#070B1E">
    <rect x="150" y="368" width="118" height="12" rx="5"/>
    <rect x="162" y="390" width="94" height="9" rx="4"/>
    <rect x="172" y="399" width="12" height="70"/>
    <rect x="234" y="399" width="12" height="70"/>
    <rect x="170" y="360" width="128" height="9" rx="4" opacity="0.9"/>
  </g>
  <!-- torii rim light -->
  <g stroke="#67E8F9" stroke-opacity="0.55" stroke-width="1.4">
    <line x1="170" y1="360" x2="298" y2="360"/>
    <line x1="150" y1="368" x2="268" y2="368"/>
  </g>
  <circle cx="196" cy="384" r="3" fill="#F5B84B" opacity="0.95"/>
  <circle cx="222" cy="384" r="3" fill="#F5B84B" opacity="0.9"/>
  <g fill="#070B1E">
    <path d="M96 428 q 10 -26 20 0 z"/>
    <path d="M330 436 q 9 -22 18 0 z"/>
    <path d="M366 442 q 8 -18 16 0 z"/>
  </g>

  <!-- celestial laboratory on right hill -->
  <g fill="#070B1E">
    <path d="M1240 436 Q 1400 404 1560 436 L 1560 440 L 1240 440 Z"/>
    <rect x="1330" y="330" width="180" height="112" rx="6"/>
    <rect x="1352" y="302" width="136" height="30" rx="4"/>
    <rect x="1410" y="266" width="6" height="38"/>
    <circle cx="1413" cy="262" r="5"/>
    <rect x="1470" y="318" width="40" height="26" rx="3"/>
  </g>
  <line x1="1352" y1="302" x2="1488" y2="302" stroke="#67E8F9" stroke-opacity="0.5" stroke-width="1.4"/>
  <g>
    <rect x="1344" y="352" width="34" height="20" rx="2" fill="#67E8F9" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1386" y="352" width="34" height="20" rx="2" fill="#F5B84B" opacity="0.9"/>
    <rect x="1428" y="352" width="34" height="20" rx="2" fill="#8B5CF6" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="6.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1470" y="352" width="28" height="20" rx="2" fill="#67E8F9" opacity="0.7"/>
    <rect x="1366" y="312" width="108" height="12" rx="2" fill="#67E8F9" opacity="0.55"/>
    <circle cx="1413" cy="262" r="4" fill="#F9A8D4">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- little robot companion on the grid, gazing up -->
  <ellipse cx="1167" cy="497" rx="26" ry="5" fill="#67E8F9" opacity="0.14" filter="url(#soft)"/>
  <g fill="#0A0F2A">
    <rect x="1152" y="446" width="30" height="38" rx="8"/>
    <rect x="1158" y="428" width="18" height="16" rx="6"/>
    <rect x="1160" y="484" width="8" height="12"/>
    <rect x="1166" y="484" width="8" height="12"/>
    <line x1="1167" y1="428" x2="1167" y2="418" stroke="#0A0F2A" stroke-width="2"/>
    <circle cx="1167" cy="415" r="3"/>
  </g>
  <line x1="1158" y1="428" x2="1176" y2="428" stroke="#67E8F9" stroke-opacity="0.6" stroke-width="1.3"/>
  <circle cx="1163" cy="436" r="2.4" fill="#67E8F9">
    <animate attributeName="opacity" values="1;0.5;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="5s" repeatCount="indefinite"/>

  <!-- ══ perspective grid floor ══ -->
  <rect x="0" y="440" width="1600" height="80" fill="#05091A"/>
  <line x1="0" y1="440" x2="1600" y2="440" stroke="url(#gridHorizon)" stroke-width="2.6" filter="url(#glow3)"/>
  <g stroke="url(#gridFade)" stroke-width="1.3">
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="464" x2="1600" y2="464"/>
    <line x1="0" y1="483" x2="1600" y2="483"/>
    <line x1="0" y1="505" x2="1600" y2="505"/>
  </g>
  <g stroke="#67E8F9" stroke-opacity="0.3" stroke-width="1.3">
    <line x1="800" y1="440" x2="745" y2="520"/>
    <line x1="800" y1="440" x2="680" y2="520"/>
    <line x1="800" y1="440" x2="600" y2="520"/>
    <line x1="800" y1="440" x2="500" y2="520"/>
    <line x1="800" y1="440" x2="800" y2="520"/>
    <line x1="800" y1="440" x2="855" y2="520"/>
    <line x1="800" y1="440" x2="920" y2="520"/>
    <line x1="800" y1="440" x2="1000" y2="520"/>
    <line x1="800" y1="440" x2="1100" y2="520"/>
  </g>
  <g stroke="#8B5CF6" stroke-opacity="0.16" stroke-width="1.3">
    <line x1="800" y1="440" x2="380" y2="520"/>
    <line x1="800" y1="440" x2="1220" y2="520"/>
  </g>
  <circle cx="0" cy="440" r="3.2" fill="#67E8F9" filter="url(#glow3)">
    <animateMotion path="M0 440 L1600 440" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="440" r="2.6" fill="#F9C4E0">
    <animateMotion path="M1600 440 L0 440" dur="11s" begin="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="11s" begin="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ══ holographic wireframe globe projection ══ -->
  <polygon points="822,486 858,486 896,398 784,398" fill="url(#beam)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </polygon>
  <rect x="824" y="486" width="32" height="9" rx="3" fill="#0B1230" stroke="#67E8F9" stroke-opacity="0.8" stroke-width="1.4"/>
  <circle cx="840" cy="492" r="3" fill="#67E8F9">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="832" cy="470" r="1.8" fill="#C7D2FE" opacity="0.8">
    <animateMotion path="M832 470 L828 404" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.85;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="848" cy="474" r="1.8" fill="#F9C4E0" opacity="0.8">
    <animateMotion path="M848 474 L852 406" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.85;1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(840 348)" filter="url(#glow3)" stroke="#67E8F9" fill="none">
    <g opacity="0.9">
      <circle r="50" stroke-opacity="0.9" stroke-width="1.6"/>
      <ellipse rx="50" ry="16" stroke-opacity="0.55" stroke-width="1.2"/>
      <line x1="-50" y1="0" x2="50" y2="0" stroke-opacity="0.45" stroke-width="1"/>
      <line x1="0" y1="-50" x2="0" y2="50" stroke-opacity="0.45" stroke-width="1"/>
      <ellipse rx="22" ry="50" stroke-opacity="0.6" stroke-width="1.1">
        <animate attributeName="rx" values="8;22;42;50;42;22;8" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="40" ry="50" stroke-opacity="0.35" stroke-width="1">
        <animate attributeName="rx" values="46;40;26;8;26;40;46" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="46" ry="30" stroke-opacity="0.4" stroke-width="1">
        <animate attributeName="ry" values="10;30;46;50;46;30;10" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="38" cy="-30" r="3" fill="#F9A8D4" stroke="none">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="56" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 6">
        <animate attributeName="stroke-dashoffset" values="0;-90" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
    <animateTransform attributeName="transform" type="translate" values="840 348;840 342;840 348" dur="6s" repeatCount="indefinite"/>
  </g>
  <ellipse cx="840" cy="404" rx="30" ry="5" fill="#67E8F9" opacity="0.18" filter="url(#soft)"/>

  <!-- ══ title lockup ══ -->
  <g>
    <text x="130" y="232" font-family="Menlo, Consolas, monospace" font-size="17" fill="#67E8F9" letter-spacing="3">// CELESTIAL LABS — DEVELOPER LOG</text>
    <text x="126" y="296" font-family="'Avenir Next','Segoe UI',Verdana,sans-serif" font-size="62" font-weight="700" fill="#67E8F9" letter-spacing="6" opacity="0.4" filter="url(#soft)">KRISHNA CHAITANYA</text>
    <text x="126" y="296" font-family="'Avenir Next','Segoe UI',Verdana,sans-serif" font-size="62" font-weight="700" fill="url(#titleGrad)" letter-spacing="6">KRISHNA CHAITANYA</text>
    <rect x="132" y="318" width="470" height="2.5" fill="url(#ruleGrad)"/>
    <text x="132" y="348" font-family="Menlo, Consolas, monospace" font-size="16.5" fill="#A8B6E8" letter-spacing="1">embodied ai · autonomous swarms · sovereign systems · spatial 3d</text>
  </g>
</svg>
