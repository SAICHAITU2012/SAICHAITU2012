<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="DecisionLens — conversations and PRs distilled into a searchable decision graph">
  <defs>
    <linearGradient id="s5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F2A"/><stop offset="1" stop-color="#122A50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#s5)"/>
  <g fill="#EAF2FF">
    <circle cx="150" cy="56" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="44" r="1.2" opacity="0.65"/>
    <circle cx="710" cy="90" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>
  <text x="40" y="58" font-family="Menlo, Consolas, monospace" font-size="14" fill="#38BDF8" letter-spacing="2">SUPERMEMORY LOCAL · KNOWLEDGE GRAPH</text>

  <!-- sources, left -->
  <g font-family="Menlo, Consolas, monospace" font-size="12.5">
    <rect x="60" y="110" rx="10" width="150" height="42" fill="#22D3EE" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.7"/>
    <text x="76" y="136" fill="#67E8F9">💬 slack threads</text>
    <rect x="60" y="170" rx="10" width="150" height="42" fill="#22D3EE" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.7"/>
    <text x="76" y="196" fill="#67E8F9">pull requests</text>
    <rect x="60" y="230" rx="10" width="150" height="42" fill="#22D3EE" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.7"/>
    <text x="76" y="256" fill="#67E8F9">adr · docs</text>
  </g>

  <!-- flow lines -->
  <g stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="5 6">
    <path d="M210 131 C 280 131 280 180 330 180" fill="none"/>
    <path d="M210 191 C 270 191 280 190 330 190" fill="none"/>
    <path d="M210 251 C 280 251 280 200 330 200" fill="none"/>
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/>
  </g>

  <!-- distill node (glowing core) -->
  <circle cx="370" cy="190" r="46" fill="#38BDF8" opacity="0.12">
    <animate attributeName="r" values="46;52;46" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="190" r="38" fill="#0B1026" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="370" y="186" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#38BDF8">distill</text>
  <text x="370" y="202" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#8FA0C8">+ embed</text>

  <!-- decision graph, right -->
  <g stroke="#B39DFF" stroke-opacity="0.8" stroke-width="2">
    <line x1="470" y1="130" x2="560" y2="170"/>
    <line x1="470" y1="190" x2="560" y2="170"/>
    <line x1="470" y1="250" x2="560" y2="170"/>
    <line x1="560" y1="170" x2="660" y2="130"/>
    <line x1="560" y1="170" x2="660" y2="220"/>
    <line x1="660" y1="130" x2="720" y2="180"/>
    <line x1="660" y1="220" x2="720" y2="180"/>
  </g>
  <g fill="#B39DFF">
    <circle cx="470" cy="130" r="7"/>
    <circle cx="470" cy="190" r="7" fill="#67E8F9"/>
    <circle cx="470" cy="250" r="7" fill="#F9C4E0"/>
    <circle cx="560" cy="170" r="9"><animate attributeName="opacity" values="1;0.5;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="130" r="7" fill="#67E8F9"/>
    <circle cx="660" cy="220" r="7" fill="#F9C4E0"/>
    <circle cx="720" cy="180" r="8"/>
  </g>
  <circle r="4.5" fill="#F6F3FF">
    <animateMotion path="M470 190 L560 170 L660 130 L720 180" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#C7D2FE">
    <text x="588" y="150">rationale</text>
    <text x="628" y="248">friction map</text>
  </g>

  <text x="40" y="345" font-family="Menlo, Consolas, monospace" font-size="15" fill="#F6F3FF" letter-spacing="1">DECISIONLENS <tspan fill="#7E8CC0" font-size="12.5">— architectural memory · zero-cloud evidence search</tspan></text>
</svg>
