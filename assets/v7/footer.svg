<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-label="Footer — moonlit torii scene with signature">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081C"/>
      <stop offset="0.6" stop-color="#0E1538"/>
      <stop offset="1" stop-color="#2B2B66"/>
    </linearGradient>
    <radialGradient id="mg4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9BFFF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#9D8FFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#9D8FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sig4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9C4E0"/>
      <stop offset="0.5" stop-color="#F6F3FF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="440" fill="url(#sky4)"/>

  <g fill="#EAF2FF">
    <circle cx="140" cy="70" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="120" r="1.1" opacity="0.65"/>
    <circle cx="560" cy="60" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="100" r="1.1" opacity="0.6"/>
    <circle cx="1040" cy="54" r="1.4" opacity="0.8"/>
    <circle cx="1520" cy="90" r="1.2"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="180" r="1" opacity="0.5"/>
    <circle cx="1320" cy="140" r="1.1" opacity="0.6"/>
  </g>
  <g fill="#7DE3F7">
    <circle cx="470" cy="150" r="1.6" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="80" r="1.6" opacity="0.85"/>
    <circle cx="700" cy="40" r="1.4" opacity="0.75"/>
  </g>

  <!-- shooting star -->
  <g opacity="0">
    <line x1="0" y1="0" x2="140" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="140" cy="48" r="2.2" fill="#FFFFFF"/>
    <animateTransform attributeName="transform" type="translate" values="1150 40;760 220;760 220" keyTimes="0;0.13;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.02;0.13;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- low moon -->
  <circle cx="420" cy="180" r="150" fill="url(#mg4)"/>
  <circle cx="420" cy="180" r="78" fill="#F6F3FF"/>
  <circle cx="396" cy="156" r="11" fill="#DCD6F7" opacity="0.55"/>
  <circle cx="448" cy="204" r="8" fill="#DCD6F7" opacity="0.5"/>
  <circle cx="420" cy="226" r="6" fill="#DCD6F7" opacity="0.45"/>

  <!-- clouds -->
  <g fill="#C7D2FE" opacity="0.1">
    <ellipse cx="900" cy="180" rx="240" ry="22"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;90 0;0 0" dur="100s" repeatCount="indefinite"/>
  </g>
  <g fill="#E8A9D8" opacity="0.08">
    <ellipse cx="1250" cy="230" rx="220" ry="20"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-80 0;0 0" dur="120s" repeatCount="indefinite"/>
  </g>

  <!-- hills -->
  <path d="M0 330 Q 400 292 800 326 T 1600 322 L 1600 440 L 0 440 Z" fill="#121A42"/>
  <path d="M0 372 Q 500 336 1000 368 T 1600 366 L 1600 440 L 0 440 Z" fill="#0A0F2A"/>

  <!-- grand torii, center-right -->
  <g fill="#060A1E">
    <rect x="1010" y="270" width="290" height="16" rx="7"/>
    <rect x="1030" y="298" width="250" height="11" rx="5"/>
    <rect x="1050" y="309" width="16" height="131"/>
    <rect x="1224" y="309" width="16" height="131"/>
    <rect x="1040" y="260" width="312" height="12" rx="5"/>
  </g>
  <circle cx="1090" cy="290" r="3.2" fill="#F5B84B" opacity="0.95"/>
  <circle cx="1130" cy="290" r="3.2" fill="#F5B84B" opacity="0.9"/>
  <circle cx="1170" cy="290" r="3.2" fill="#F5B84B" opacity="0.85"/>

  <!-- pines + fireflies -->
  <g fill="#060A1E">
    <path d="M330 356 q 12 -34 24 0 z"/>
    <path d="M380 366 q 10 -26 20 0 z"/>
    <path d="M1460 356 q 11 -28 22 0 z"/>
    <path d="M1500 364 q 9 -22 18 0 z"/>
  </g>
  <g fill="#F5B84B">
    <circle cx="620" cy="352" r="2.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="368" r="2.2"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="356" r="2.4"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="374" r="2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="360" r="2.4"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- signature -->
  <g text-anchor="middle">
    <text x="800" y="196" font-family="Menlo, Consolas, monospace" font-size="15" fill="#67E8F9" letter-spacing="4">— END OF TRANSMISSION —</text>
    <text x="800" y="252" font-family="'Avenir Next','Segoe UI',Verdana,sans-serif" font-size="44" font-weight="700" fill="url(#sig4)" letter-spacing="8">KRISHNA CHAITANYA</text>
    <text x="800" y="288" font-family="Menlo, Consolas, monospace" font-size="14.5" fill="#A8B6E8" letter-spacing="1">the universe is a simulation — keep building yours.</text>
    <text x="800" y="416" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5E6B96">© 2026 · crafted pixel by pixel · no templates were harmed</text>
  </g>
</svg>
