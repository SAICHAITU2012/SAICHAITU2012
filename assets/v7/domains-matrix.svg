<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-label="Core Engineering Domains — four floating 3D matrix cards over a holographic grid: embodied AI, swarms and LLM, sovereign AI, spatial 3D">
  <defs>
    <linearGradient id="mxSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081C"/>
      <stop offset="0.72" stop-color="#0C1230"/>
      <stop offset="1" stop-color="#141B44"/>
    </linearGradient>
    <linearGradient id="mxCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B132B" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#070C18" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="mx_side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040814"/>
      <stop offset="1" stop-color="#02040A"/>
    </linearGradient>
    <linearGradient id="mxCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="mxPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B39DFF"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="mxGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="mxAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B84B"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="mxHorizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#67E8F9" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#F9C4E0" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mxGridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="mxGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mxSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="440" fill="url(#mxSky)"/>

  <!-- stars + moon identity -->
  <g fill="#EAF2FF">
    <circle cx="90" cy="34" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="22" r="1.1" opacity="0.6"/>
    <circle cx="640" cy="38" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="24" r="1.1" opacity="0.6"/>
    <circle cx="1230" cy="40" r="1.3" opacity="0.8"/>
    <circle cx="1530" cy="30" r="1.2"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="1548" cy="38" r="30" fill="#F6F3FF" opacity="0.96"/>
  <circle cx="1540" cy="30" r="4.5" fill="#DCD6F7" opacity="0.55"/>
  <circle cx="1556" cy="46" r="3" fill="#DCD6F7" opacity="0.5"/>

  <!-- header telemetry -->
  <g font-family="Menlo, Consolas, monospace">
    <text x="40" y="34" font-size="11" fill="#67E8F9" letter-spacing="2">// CORE SPECIALIZATION DOMAINS &amp; PRODUCTION WORKSPACES</text>
    <text x="1460" y="34" text-anchor="end" font-size="9.5" fill="#7E8CC0" letter-spacing="1.5">SIM-TO-REAL · DETERMINISTIC VERIFICATION</text>
  </g>

  <!-- ════ CARD 1 · EMBODIED AI ════ -->
  <g transform="translate(40 66)">
    <rect x="7" y="7" width="330" height="252" rx="14" fill="url(#mx_side)" opacity="0.9"/>
    <rect width="330" height="252" rx="14" fill="url(#mxCard)" stroke="#2A3560" stroke-width="1.3"/>
    <path d="M14 0 h 302 v 4 h -302 z" fill="url(#mxCyan)" opacity="0.95"/>
    <rect x="1" y="1" width="328" height="8" rx="7" fill="none" stroke="#67E8F9" stroke-opacity="0.25"/>
    <circle cx="26" cy="30" r="4" fill="#67E8F9" filter="url(#mxGlow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g font-family="Menlo, Consolas, monospace">
      <text x="40" y="34" font-size="11" fill="#67E8F9" font-weight="700" letter-spacing="1.5">01 // EMBODIED AI</text>
      <text x="26" y="66" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Robotics &amp; RL Simulation</text>
      <text x="26" y="90" font-size="11.5" fill="#94A3B8">PPO training, LfD teleoperation and</text>
      <text x="26" y="106" font-size="11.5" fill="#94A3B8">physics-accurate humanoid &amp; swarm sim.</text>
      <!-- wireframe robot glyph -->
      <g transform="translate(292 34) scale(0.85)" stroke="#67E8F9" fill="none" stroke-width="1.8">
        <rect x="-18" y="-14" width="36" height="28" rx="9"/>
        <circle cx="-7" cy="0" r="3.4" fill="#67E8F9"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
        <circle cx="7" cy="0" r="3.4" fill="#67E8F9"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/></circle>
        <line x1="0" y1="-14" x2="0" y2="-24"/>
        <circle cx="0" cy="-27" r="3" fill="#F9A8D4" stroke="none"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
      </g>
      <g font-size="10">
        <rect x="26" y="122" width="94" height="21" rx="5" fill="#0E1A2D" stroke="#67E8F9" stroke-opacity="0.45"/>
        <text x="34" y="136" fill="#7DE3F7">Genesis World</text>
        <rect x="126" y="122" width="82" height="21" rx="5" fill="#0E1A2D" stroke="#67E8F9" stroke-opacity="0.45"/>
        <text x="134" y="136" fill="#7DE3F7">MuJoCo 3.17</text>
        <rect x="26" y="149" width="78" height="21" rx="5" fill="#0E1A2D" stroke="#67E8F9" stroke-opacity="0.45"/>
        <text x="34" y="163" fill="#7DE3F7">Unitree G1</text>
        <rect x="110" y="149" width="62" height="21" rx="5" fill="#0E1A2D" stroke="#67E8F9" stroke-opacity="0.45"/>
        <text x="118" y="163" fill="#7DE3F7">PyTorch</text>
      </g>
      <text x="26" y="204" font-size="10.5" fill="#34D399">● 2/2 payload drops @ 0.547 m precision</text>
      <text x="26" y="226" font-size="9.5" fill="#5E6B96">genesis world v1.4.5 · apple m4 silicon</text>
    </g>
  </g>

  <!-- ════ CARD 2 · SWARMS + LLM ════ -->
  <g transform="translate(434 66)">
    <rect x="7" y="7" width="330" height="252" rx="14" fill="url(#mx_side)" opacity="0.9"/>
    <rect width="330" height="252" rx="14" fill="url(#mxCard)" stroke="#2A3560" stroke-width="1.3"/>
    <path d="M14 0 h 302 v 4 h -302 z" fill="url(#mxPurple)"/>
    <g font-family="Menlo, Consolas, monospace">
      <circle cx="26" cy="30" r="4" fill="#B39DFF" filter="url(#mxGlow)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="34" font-size="11" fill="#B39DFF" font-weight="700" letter-spacing="1.5">02 // SWARMS + LLM</text>
      <text x="26" y="66" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Autonomous Multi-Agent</text>
      <text x="26" y="90" font-size="11.5" fill="#94A3B8">Local LLM commanders plan over learned</text>
      <text x="26" y="106" font-size="11.5" fill="#94A3B8">skills — deterministic rule arbitration.</text>
      <g transform="translate(292 34) scale(0.85)" stroke="#B39DFF" fill="none" stroke-width="1.8">
        <line x1="0" y1="-16" x2="-17" y2="12"/><line x1="0" y1="-16" x2="17" y2="12"/><line x1="-17" y1="12" x2="17" y2="12"/>
        <circle cx="0" cy="-16" r="5" fill="#B39DFF" stroke="none"/>
        <circle cx="-17" cy="12" r="4" fill="#67E8F9" stroke="none"><animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/></circle>
        <circle cx="17" cy="12" r="4" fill="#F9C4E0" stroke="none"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
      </g>
      <g font-size="10">
        <rect x="26" y="122" width="72" height="21" rx="5" fill="#141026" stroke="#B39DFF" stroke-opacity="0.45"/>
        <text x="34" y="136" fill="#C4B0FF">Qwen 2.5</text>
        <rect x="104" y="122" width="58" height="21" rx="5" fill="#141026" stroke="#B39DFF" stroke-opacity="0.45"/>
        <text x="112" y="136" fill="#C4B0FF">Ollama</text>
        <rect x="26" y="149" width="70" height="21" rx="5" fill="#141026" stroke="#B39DFF" stroke-opacity="0.45"/>
        <text x="34" y="163" fill="#C4B0FF">Local RAG</text>
        <rect x="102" y="149" width="60" height="21" rx="5" fill="#141026" stroke="#B39DFF" stroke-opacity="0.45"/>
        <text x="110" y="163" fill="#C4B0FF">Shared Mem</text>
      </g>
      <text x="26" y="204" font-size="10.5" fill="#34D399">● on-device planning loop · json task specs</text>
      <text x="26" y="226" font-size="9.5" fill="#5E6B96">deterministic arbitration · verified control</text>
    </g>
  </g>

  <!-- ════ CARD 3 · SOVEREIGN AI ════ -->
  <g transform="translate(828 66)">
    <rect x="7" y="7" width="330" height="252" rx="14" fill="url(#mx_side)" opacity="0.9"/>
    <rect width="330" height="252" rx="14" fill="url(#mxCard)" stroke="#2A3560" stroke-width="1.3"/>
    <path d="M14 0 h 302 v 4 h -302 z" fill="url(#mxGreen)"/>
    <g font-family="Menlo, Consolas, monospace">
      <circle cx="26" cy="30" r="4" fill="#34D399" filter="url(#mxGlow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="34" font-size="11" fill="#34D399" font-weight="700" letter-spacing="1.5">03 // SOVEREIGN AI</text>
      <text x="26" y="66" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Air-Gapped Workbenches</text>
      <text x="26" y="90" font-size="11.5" fill="#94A3B8">Confidential industrial inference with</text>
      <text x="26" y="106" font-size="11.5" fill="#94A3B8">zero outbound traffic — 100% on-device.</text>
      <g transform="translate(292 34) scale(0.85)" stroke="#34D399" fill="none" stroke-width="1.8">
        <path d="M0 -18 l 14 6 v 11 c 0 12 -8 19 -14 23 c -6 -4 -14 -11 -14 -23 v -11 z"/>
        <rect x="-5" y="2" width="10" height="8" rx="2" fill="#34D399" stroke="none"/>
        <path d="M-3 2 v -5 a 3 3 0 0 1 6 0 v 5"/>
        <circle cx="20" cy="-16" r="2.2" fill="#34D399" stroke="none"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      </g>
      <g font-size="10">
        <rect x="26" y="122" width="62" height="21" rx="5" fill="#071A16" stroke="#34D399" stroke-opacity="0.45"/>
        <text x="34" y="136" fill="#5EEAD4">FastAPI</text>
        <rect x="94" y="122" width="56" height="21" rx="5" fill="#071A16" stroke="#34D399" stroke-opacity="0.45"/>
        <text x="102" y="136" fill="#5EEAD4">Docker</text>
        <rect x="26" y="149" width="84" height="21" rx="5" fill="#071A16" stroke="#34D399" stroke-opacity="0.45"/>
        <text x="34" y="163" fill="#5EEAD4">Vector Store</text>
        <rect x="116" y="149" width="46" height="21" rx="5" fill="#071A16" stroke="#34D399" stroke-opacity="0.45"/>
        <text x="124" y="163" fill="#5EEAD4">Ollama</text>
      </g>
      <text x="26" y="204" font-size="10.5" fill="#34D399">● outbound: 0 bytes · socket-level block</text>
      <text x="26" y="226" font-size="9.5" fill="#5E6B96">sih26117 · mangalore refinery specs</text>
    </g>
  </g>

  <!-- ════ CARD 4 · SPATIAL 3D ════ -->
  <g transform="translate(1222 66)">
    <rect x="7" y="7" width="330" height="252" rx="14" fill="url(#mx_side)" opacity="0.9"/>
    <rect width="330" height="252" rx="14" fill="url(#mxCard)" stroke="#2A3560" stroke-width="1.3"/>
    <path d="M14 0 h 302 v 4 h -302 z" fill="url(#mxAmber)"/>
    <g font-family="Menlo, Consolas, monospace">
      <circle cx="26" cy="30" r="4" fill="#F5B84B" filter="url(#mxGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="34" font-size="11" fill="#F5B84B" font-weight="700" letter-spacing="1.5">04 // SPATIAL 3D + SYSTEMS</text>
      <text x="26" y="66" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Worlds &amp; Core Systems</text>
      <text x="26" y="90" font-size="11.5" fill="#94A3B8">WebGL gravity sandboxes, POSIX shells,</text>
      <text x="26" y="106" font-size="11.5" fill="#94A3B8">full-stack TypeScript architectures.</text>
      <g transform="translate(292 34) scale(0.85)" stroke="#F5B84B" fill="none" stroke-width="1.8">
        <circle cx="0" cy="0" r="14"/>
        <ellipse cx="0" cy="0" rx="24" ry="8" transform="rotate(-16)"/>
        <circle cx="17" cy="-9" r="2.6" fill="#F5B84B" stroke="none"><animate attributeName="opacity" values="1;0.35;1" dur="2.3s" repeatCount="indefinite"/></circle>
        <path d="M-20 20 h 8 m -8 5 h 12" stroke="#67E8F9"/>
      </g>
      <g font-size="10">
        <rect x="26" y="122" width="62" height="21" rx="5" fill="#1A1226" stroke="#F5B84B" stroke-opacity="0.45"/>
        <text x="34" y="136" fill="#FBD38D">Three.js</text>
        <rect x="94" y="122" width="46" height="21" rx="5" fill="#1A1226" stroke="#F5B84B" stroke-opacity="0.45"/>
        <text x="102" y="136" fill="#FBD38D">R3F</text>
        <rect x="26" y="149" width="46" height="21" rx="5" fill="#1A1226" stroke="#F5B84B" stroke-opacity="0.45"/>
        <text x="34" y="163" fill="#FBD38D">Expo</text>
        <rect x="78" y="149" width="52" height="21" rx="5" fill="#1A1226" stroke="#F5B84B" stroke-opacity="0.45"/>
        <text x="86" y="163" fill="#FBD38D">C++17</text>
      </g>
      <text x="26" y="204" font-size="10.5" fill="#34D399">● 60 fps celestial render on mobile</text>
      <text x="26" y="226" font-size="9.5" fill="#5E6B96">posix conformance suite · codecrafters</text>
    </g>
  </g>

  <!-- ════ data conduits between cards ════ -->
  <g stroke-width="1.6">
    <line x1="370" y1="192" x2="434" y2="192" stroke="#67E8F9" stroke-opacity="0.5" stroke-dasharray="5 5"/>
    <line x1="764" y1="192" x2="828" y2="192" stroke="#B39DFF" stroke-opacity="0.5" stroke-dasharray="5 5"/>
    <line x1="1158" y1="192" x2="1222" y2="192" stroke="#34D399" stroke-opacity="0.5" stroke-dasharray="5 5"/>
    <circle r="3.5" fill="#F6F3FF">
      <animateMotion path="M370 192 L434 192" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#F6F3FF">
      <animateMotion path="M764 192 L828 192" dur="2.9s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#F6F3FF">
      <animateMotion path="M1158 192 L1222 192" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ════ perspective grid floor ════ -->
  <rect x="0" y="336" width="1600" height="104" fill="#060A1E"/>
  <line x1="0" y1="336" x2="1600" y2="336" stroke="url(#mxHorizon)" stroke-width="2.4" filter="url(#mxGlow)"/>
  <g stroke="url(#mxGridFade)" stroke-width="1.2">
    <line x1="0" y1="358" x2="1600" y2="358"/>
    <line x1="0" y1="384" x2="1600" y2="384"/>
    <line x1="0" y1="414" x2="1600" y2="414"/>
  </g>
  <g stroke="#67E8F9" stroke-opacity="0.22" stroke-width="1.2">
    <line x1="800" y1="336" x2="380" y2="440"/>
    <line x1="800" y1="336" x2="590" y2="440"/>
    <line x1="800" y1="336" x2="800" y2="440"/>
    <line x1="800" y1="336" x2="1010" y2="440"/>
    <line x1="800" y1="336" x2="1220" y2="440"/>
  </g>
  <g stroke="#8B5CF6" stroke-opacity="0.14" stroke-width="1.2">
    <line x1="800" y1="336" x2="170" y2="440"/>
    <line x1="800" y1="336" x2="1430" y2="440"/>
  </g>
  <!-- traveling horizon pulses -->
  <circle cx="0" cy="336" r="3" fill="#67E8F9">
    <animateMotion path="M0 336 L1600 336" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="336" r="2.5" fill="#F9C4E0">
    <animateMotion path="M1600 336 L0 336" dur="12s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="12s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- floating wireframe accents -->
  <g stroke="#67E8F9" stroke-opacity="0.5" fill="none" stroke-width="1.4">
    <g transform="translate(216 356)">
      <rect x="-11" y="-11" width="22" height="22" rx="3"/>
      <rect x="-11" y="-11" width="22" height="22" rx="3" transform="rotate(45)">
        <animateTransform attributeName="transform" type="rotate" values="45;85;45" dur="6s" repeatCount="indefinite"/>
      </rect>
      <animateTransform attributeName="transform" type="translate" values="216 356;216 350;216 356" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
