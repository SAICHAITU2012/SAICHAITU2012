<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" width="1600" height="340" role="img" aria-label="Current research frontiers — 3D orbital map with wireframe globe and three exploration nodes">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081C"/>
      <stop offset="1" stop-color="#121A42"/>
    </linearGradient>
    <radialGradient id="core3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g3horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g3glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="340" fill="url(#sky3)"/>

  <g fill="#EAF2FF" opacity="0.75">
    <circle cx="160" cy="60" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="900" cy="72" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="52" r="1.2" opacity="0.7"/>
    <circle cx="1480" cy="110" r="1.1" opacity="0.55"/>
    <circle cx="320" cy="290" r="1" opacity="0.5"/>
    <circle cx="1180" cy="300" r="1.1" opacity="0.55"/>
  </g>

  <!-- perspective grid floor hint -->
  <line x1="0" y1="318" x2="1600" y2="318" stroke="url(#g3horizon)" stroke-width="1.6"/>
  <g stroke="#67E8F9" stroke-opacity="0.12" stroke-width="1">
    <line x1="800" y1="318" x2="560" y2="340"/>
    <line x1="800" y1="318" x2="1040" y2="340"/>
    <line x1="800" y1="318" x2="300" y2="340"/>
    <line x1="800" y1="318" x2="1300" y2="340"/>
    <line x1="0" y1="328" x2="1600" y2="328"/>
  </g>

  <!-- orbital map -->
  <g transform="translate(800 160)">
    <ellipse cx="0" cy="0" rx="300" ry="104" fill="none" stroke="#67E8F9" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 7"/>
    <ellipse cx="0" cy="0" rx="430" ry="142" fill="none" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 8"/>

    <!-- glow core behind wireframe globe -->
    <circle cx="0" cy="0" r="118" fill="url(#core3)">
      <animate attributeName="r" values="118;130;118" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- 3D wireframe globe -->
    <g filter="url(#g3glow)" stroke="#67E8F9" fill="none">
      <circle r="46" stroke-opacity="0.95" stroke-width="2" fill="#0B1026" fill-opacity="0.85"/>
      <ellipse rx="46" ry="15" stroke-opacity="0.55" stroke-width="1.1"/>
      <ellipse rx="46" ry="30" stroke-opacity="0.4" stroke-width="1"/>
      <ellipse rx="18" ry="46" stroke-opacity="0.6" stroke-width="1.1">
        <animate attributeName="rx" values="6;18;36;46;36;18;6" dur="10s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="36" ry="46" stroke-opacity="0.35" stroke-width="1">
        <animate attributeName="rx" values="44;36;22;6;22;36;44" dur="10s" repeatCount="indefinite"/>
      </ellipse>
      <line x1="-46" y1="0" x2="46" y2="0" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="0" y1="-46" x2="0" y2="46" stroke-opacity="0.5" stroke-width="1"/>
      <circle r="55" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 6">
        <animate attributeName="stroke-dashoffset" values="0;-88" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- core label plate -->
    <g font-family="Menlo, Consolas, monospace">
      <rect x="-62" y="58" rx="7" width="124" height="40" fill="#0B1026" fill-opacity="0.92" stroke="#67E8F9" stroke-opacity="0.8" stroke-width="1.3"/>
      <text x="0" y="76" text-anchor="middle" font-size="13" fill="#67E8F9" letter-spacing="2">OPEN</text>
      <text x="0" y="92" text-anchor="middle" font-size="13" fill="#C7D2FE" letter-spacing="2">FRONTIERS</text>
    </g>

    <!-- satellites -->
    <circle r="5" fill="#F9C4E0" filter="url(#g3glow)">
      <animateMotion path="M300 0 A 300 104 0 1 1 -300 0 A 300 104 0 1 1 300 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#67E8F9" filter="url(#g3glow)">
      <animateMotion path="M430 0 A 430 142 0 1 0 -430 0 A 430 142 0 1 0 430 0" dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- node chips on orbits -->
    <g font-family="Menlo, Consolas, monospace">
      <g transform="translate(-430 0)">
        <rect x="8" y="-21" rx="7" width="212" height="42" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.8"/>
        <rect x="12" y="-17" rx="6" width="212" height="42" fill="#04070d" fill-opacity="0.55" stroke="none"/>
        <rect x="8" y="-21" rx="7" width="212" height="42" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.8"/>
        <text x="20" y="-4" font-size="13.5" fill="#B39DFF">01 · sim-to-real</text>
        <text x="20" y="14" font-size="11.5" fill="#8FA0C8">locomotion transfer · mujoco</text>
      </g>
      <g transform="translate(300 0)">
        <rect x="-220" y="-21" rx="7" width="212" height="42" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.8"/>
        <text x="-208" y="-4" font-size="13.5" fill="#67E8F9">02 · agent determinism</text>
        <text x="-208" y="14" font-size="11.5" fill="#8FA0C8">llm planners · verified control</text>
      </g>
      <g transform="translate(304 100)">
        <rect x="8" y="-21" rx="7" width="230" height="42" fill="#F9A8D4" fill-opacity="0.09" stroke="#F9A8D4" stroke-opacity="0.7"/>
        <text x="20" y="-4" font-size="13.5" fill="#F9C4E0">03 · local inference</text>
        <text x="20" y="14" font-size="11.5" fill="#8FA0C8">kv-cache · apple silicon loops</text>
      </g>
    </g>
  </g>
</svg>
