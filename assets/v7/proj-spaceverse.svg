<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="SpaceVerse — phone-first 3D celestial physics sandbox">
  <defs>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F2A"/><stop offset="1" stop-color="#33205C"/>
    </linearGradient>
    <radialGradient id="planet4" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#F9A8D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </radialGradient>
  </defs>
  <rect width="800" height="360" fill="url(#s4)"/>
  <g fill="#EAF2FF">
    <circle cx="110" cy="60" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="50" r="1.2" opacity="0.7"/>
    <circle cx="740" cy="110" r="1.4"><animate attributeName="opacity" values="1;0.35;1" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="90" r="1" opacity="0.55"/>
    <circle cx="520" cy="140" r="1.1" opacity="0.6"/>
  </g>
  <text x="40" y="58" font-family="Menlo, Consolas, monospace" font-size="14" fill="#F9C4E0" letter-spacing="2">EXPO · REACT THREE FIBER · 60 FPS</text>

  <!-- projected solar system above the phone -->
  <g transform="translate(400 170)">
    <ellipse cx="0" cy="0" rx="150" ry="58" fill="none" stroke="#67E8F9" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="5 6"/>
    <ellipse cx="0" cy="0" rx="102" ry="38" fill="none" stroke="#B39DFF" stroke-opacity="0.55" stroke-width="1.4" transform="rotate(-14)"/>
    <circle r="34" fill="url(#planet4)"/>
    <ellipse cx="0" cy="0" rx="56" ry="15" fill="none" stroke="#F9C4E0" stroke-width="2.5" transform="rotate(-16)"/>
    <circle cx="150" cy="0" r="6" fill="#67E8F9">
      <animateMotion path="M150 0 A 150 58 0 1 0 -150 0 A 150 58 0 1 0 150 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-102" cy="0" r="4.5" fill="#F5B84B">
      <animateMotion path="M-102 0 A 102 38 0 1 1 102 0 A 102 38 0 1 1 -102 0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="86" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#C7D2FE">g = G·m/r²  ·  drag to bend orbits</text>
  </g>

  <!-- phone (extruded + projection beam) -->
  <polygon points="352,258 448,258 470,196 330,196" fill="#67E8F9" opacity="0.07">
    <animate attributeName="opacity" values="0.07;0.16;0.07" dur="3.4s" repeatCount="indefinite"/>
  </polygon>
  <g transform="translate(400 292)">
    <rect x="-52" y="-28" width="116" height="72" rx="14" fill="#04070d" opacity="0.85"/>
    <rect x="-58" y="-34" width="116" height="72" rx="14" fill="#0A0F2A" stroke="#67E8F9" stroke-width="2.5"/>
    <rect x="-50" y="-26" width="100" height="56" rx="8" fill="#12183C"/>
    <rect x="-14" y="22" width="28" height="4" rx="2" fill="#67E8F9" opacity="0.7"/>
    <circle cx="0" cy="-2" r="9" fill="none" stroke="#F9A8D4" stroke-width="2">
      <animate attributeName="r" values="7;12;7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- beam from phone to system -->
  <line x1="400" y1="256" x2="400" y2="218" stroke="#67E8F9" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="3 4">
    <animate attributeName="stroke-opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </line>

  <text x="40" y="345" font-family="Menlo, Consolas, monospace" font-size="15" fill="#F6F3FF" letter-spacing="1">SPACEVERSE <tspan fill="#7E8CC0" font-size="12.5">— interactive gravity sandbox · real planetary parameters</tspan></text>
</svg>
