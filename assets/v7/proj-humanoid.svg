<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Humanoid-LfD — 23-DoF Unitree G1 learning from demonstration in MuJoCo">
  <defs>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F2A"/><stop offset="1" stop-color="#231B52"/>
    </linearGradient>
    <linearGradient id="traj2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9A8D4" stop-opacity="0"/>
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#s2)"/>
  <g fill="#EAF2FF">
    <circle cx="120" cy="50" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="36" r="1.1" opacity="0.6"/>
    <circle cx="700" cy="60" r="1.4"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <text x="40" y="58" font-family="Menlo, Consolas, monospace" font-size="14" fill="#B39DFF" letter-spacing="2">MUJOCO 3.17 · LEARNING FROM DEMONSTRATION</text>

  <!-- trajectory trace -->
  <path d="M60 220 Q 220 120 400 190 T 700 160" fill="none" stroke="url(#traj2)" stroke-width="2.5" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" values="0;-56" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <circle cx="220" cy="142" r="4" fill="#F9C4E0"/>
  <circle cx="560" cy="176" r="4" fill="#F9C4E0"/>

  <!-- humanoid figure, jointed -->
  <g stroke="#0A0F2A" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="400" y1="140" x2="400" y2="216"/>
    <line x1="400" y1="150" x2="362" y2="196"/>
    <line x1="400" y1="150" x2="440" y2="198"/>
    <line x1="400" y1="216" x2="376" y2="288"/>
    <line x1="400" y1="216" x2="428" y2="288"/>
  </g>
  <g fill="#EAF2FF">
    <circle cx="400" cy="118" r="17" fill="#EAF2FF"/>
    <rect x="386" y="134" width="28" height="14" rx="5" fill="#EAF2FF"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="400" cy="140" r="6"><animate attributeName="opacity" values="1;0.45;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="362" cy="196" r="5.5"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="198" r="5.5"><animate attributeName="opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="216" r="6.5"/>
    <circle cx="376" cy="288" r="5.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="428" cy="288" r="5.5"/>
  </g>
  <text x="400" y="96" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#67E8F9">23-DoF</text>

  <!-- platform -->
  <ellipse cx="400" cy="304" rx="120" ry="16" fill="#0A0F2A"/>
  <ellipse cx="400" cy="304" rx="120" ry="16" fill="none" stroke="#8B5CF6" stroke-opacity="0.7" stroke-width="2"/>

  <!-- holo IK panel -->
  <g font-family="Menlo, Consolas, monospace" font-size="12.5">
    <rect x="560" y="220" rx="8" width="200" height="76" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.8"/>
    <text x="574" y="244" fill="#B39DFF">&gt; replay(demo.path)</text>
    <text x="574" y="264" fill="#C7D2FE">ik.solve() → 23 joints</text>
    <text x="574" y="284" fill="#7E8CC0">err: 0.0031 rad ✓</text>
  </g>

  <text x="40" y="345" font-family="Menlo, Consolas, monospace" font-size="15" fill="#F6F3FF" letter-spacing="1">HUMANOID-LFD <tspan fill="#7E8CC0" font-size="12.5">— unitree g1 · awign × armature ai labs challenge</tspan></text>
</svg>
