<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none" role="img" aria-label="Krishna Chaitanya — Engineering Architecture Matrix">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#070C18" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .live-dot {
        animation: pulseDot 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .card-box {
        transition: stroke 0.3s ease;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="280" rx="16" fill="url(#matrixBg)" />
  <rect width="1200" height="280" rx="16" stroke="#1E293B" stroke-width="1.2" />

  <!-- Matrix Header Telemetry -->
  <g transform="translate(32, 28)">
    <text font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F2FE" letter-spacing="2">
      // CORE SPECIALIZATION DOMAINS &amp; PRODUCTION WORKSPACES
    </text>
    <text x="1136" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" letter-spacing="1">
      STRICT SIM-TO-REAL &amp; DETERMINISTIC VERIFICATION
    </text>
  </g>

  <!-- COLUMN 1: EMBODIED AI & ROBOTICS -->
  <g transform="translate(32, 52)">
    <rect width="265" height="202" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" class="card-box" />
    <path d="M0 12 Q 0 0 12 0 L 253 0 Q 265 0 265 12 L 265 3 L 0 3 Z" fill="url(#cyanGrad)" />
    
    <!-- Header with Indicator -->
    <circle cx="24" cy="28" r="4" fill="#00F2FE" class="live-dot" />
    <text x="36" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F2FE" font-weight="700" letter-spacing="1">01 // EMBODIED AI</text>
    
    <!-- Title -->
    <text x="24" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
      Robotics &amp; Sim
    </text>

    <!-- Description -->
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">
      Reinforcement learning (PPO), imitation
    </text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">
      learning (LfD), and physics simulation.
    </text>

    <!-- Stack Chips -->
    <g transform="translate(24, 126)" font-family="'JetBrains Mono', monospace" font-size="9">
      <rect width="90" height="20" rx="4" fill="#0E1A2D" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="8" y="14" fill="#38BDF8">Genesis World</text>

      <rect x="96" width="76" height="20" rx="4" fill="#0E1A2D" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="104" y="14" fill="#38BDF8">MuJoCo 3.17</text>

      <rect y="26" width="76" height="20" rx="4" fill="#0E1A2D" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="8" y="40" fill="#38BDF8">Unitree G1</text>

      <rect x="82" y="26" width="60" height="20" rx="4" fill="#0E1A2D" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="90" y="40" fill="#38BDF8">PyTorch</text>
    </g>

    <text x="24" y="186" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">
      ● 0.547m drop precision
    </text>
  </g>

  <!-- COLUMN 2: MULTI-AGENT SYSTEMS -->
  <g transform="translate(325, 52)">
    <rect width="265" height="202" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" class="card-box" />
    <path d="M0 12 Q 0 0 12 0 L 253 0 Q 265 0 265 12 L 265 3 L 0 3 Z" fill="url(#purpleGrad)" />

    <!-- Header with Indicator -->
    <circle cx="24" cy="28" r="4" fill="#8B5CF6" class="live-dot" />
    <text x="36" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A78BFA" font-weight="700" letter-spacing="1">02 // AGENTIC AI</text>

    <!-- Title -->
    <text x="24" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
      Autonomous Swarms
    </text>

    <!-- Description -->
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">
      Multi-agent coordination, deterministic
    </text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">
      rule planners &amp; LLM task commanders.
    </text>

    <!-- Stack Chips -->
    <g transform="translate(24, 126)" font-family="'JetBrains Mono', monospace" font-size="9">
      <rect width="84" height="20" rx="4" fill="#17122E" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="8" y="14" fill="#C4B5FD">Qwen 2.5 LLM</text>

      <rect x="90" width="70" height="20" rx="4" fill="#17122E" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="98" y="14" fill="#C4B5FD">Ollama API</text>

      <rect y="26" width="84" height="20" rx="4" fill="#17122E" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="8" y="40" fill="#C4B5FD">MultiBot PPO</text>

      <rect x="90" y="26" width="70" height="20" rx="4" fill="#17122E" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="98" y="40" fill="#C4B5FD">Clawboo</text>
    </g>

    <text x="24" y="186" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">
      ● 4/4 independent runs OK
    </text>
  </g>

  <!-- COLUMN 3: AIR-GAPPED & LOCAL-FIRST AI -->
  <g transform="translate(618, 52)">
    <rect width="265" height="202" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" class="card-box" />
    <path d="M0 12 Q 0 0 12 0 L 253 0 Q 265 0 265 12 L 265 3 L 0 3 Z" fill="url(#emeraldGrad)" />

    <!-- Header with Indicator -->
    <circle cx="24" cy="28" r="4" fill="#10B981" class="live-dot" />
    <text x="36" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" font-weight="700" letter-spacing="1">03 // SOVEREIGN AI</text>

    <!-- Title -->
    <text x="24" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
      Air-Gapped Systems
    </text>

    <!-- Description -->
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">
      Zero outbound network leak. On-premise
    </text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">
      multimodal retrieval &amp; confidential tools.
    </text>

    <!-- Stack Chips -->
    <g transform="translate(24, 126)" font-family="'JetBrains Mono', monospace" font-size="9">
      <rect width="80" height="20" rx="4" fill="#081E19" stroke="#10B981" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="8" y="14" fill="#6EE7B7">SIH 26117</text>

      <rect x="86" width="76" height="20" rx="4" fill="#081E19" stroke="#10B981" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="94" y="14" fill="#6EE7B7">FastAPI RAG</text>

      <rect y="26" width="86" height="20" rx="4" fill="#081E19" stroke="#10B981" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="8" y="40" fill="#6EE7B7">Local Embed</text>

      <rect x="92" y="26" width="86" height="20" rx="4" fill="#081E19" stroke="#10B981" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="100" y="40" fill="#6EE7B7">DecisionLens</text>
    </g>

    <text x="24" y="186" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">
      ● Audited air-gap active
    </text>
  </g>

  <!-- COLUMN 4: 3D GRAPHICS & SYSTEMS CORE -->
  <g transform="translate(911, 52)">
    <rect width="257" height="202" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" class="card-box" />
    <path d="M0 12 Q 0 0 12 0 L 245 0 Q 257 0 257 12 L 257 3 L 0 3 Z" fill="url(#amberGrad)" />

    <!-- Header with Indicator -->
    <circle cx="24" cy="28" r="4" fill="#F59E0B" class="live-dot" />
    <text x="36" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24" font-weight="700" letter-spacing="1">04 // GRAPHICS &amp; OS</text>

    <!-- Title -->
    <text x="24" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
      Spatial &amp; Core C++
    </text>

    <!-- Description -->
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">
      Real-time WebGL/Three.js celestial sim
    </text>
    <text x="24" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94A3B8">
      &amp; POSIX-compliant shell architecture.
    </text>

    <!-- Stack Chips -->
    <g transform="translate(24, 126)" font-family="'JetBrains Mono', monospace" font-size="9">
      <rect width="68" height="20" rx="4" fill="#201507" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="8" y="14" fill="#FDE68A">Three.js</text>

      <rect x="74" width="76" height="20" rx="4" fill="#201507" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="82" y="14" fill="#FDE68A">React Native</text>

      <rect y="26" width="74" height="20" rx="4" fill="#201507" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="8" y="40" fill="#FDE68A">SpaceVerse</text>

      <rect x="80" y="26" width="70" height="20" rx="4" fill="#201507" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="88" y="40" fill="#FDE68A">C++ POSIX</text>
    </g>

    <text x="24" y="186" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">
      ● 60 FPS mobile WebGL
    </text>
  </g>
</svg>
