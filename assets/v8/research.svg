<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" width="1600" height="340" role="img" aria-label="Research frontiers — wireframe globe with three exploration nodes: sim-to-real transfer, agent determinism, local inference throughput">
  <defs>
    <linearGradient id="r8sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <radialGradient id="r8core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r8horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <filter id="r8glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="340" fill="url(#r8sky)"/>

  <g fill="#C9D4E8" opacity="0.5">
    <circle cx="200" cy="52" r="0.9" opacity="0.5"/><circle cx="480" cy="40" r="0.8" opacity="0.4"/>
    <circle cx="960" cy="64" r="1" opacity="0.45"/><circle cx="1340" cy="48" r="0.8" opacity="0.4"/>
    <circle cx="1180" cy="300" r="0.8" opacity="0.35"/>
  </g>

  <line x1="0" y1="316" x2="1600" y2="316" stroke="url(#r8horizon)" stroke-width="1"/>
  <g stroke="#67E8F9" stroke-opacity="0.08" stroke-width="1">
    <line x1="800" y1="316" x2="560" y2="340"/>
    <line x1="800" y1="316" x2="1040" y2="340"/>
    <line x1="800" y1="316" x2="80" y2="340"/>
    <line x1="800" y1="316" x2="1520" y2="340"/>
  </g>

  <g transform="translate(800 158)">
    <ellipse rx="300" ry="100" fill="none" stroke="#263043" stroke-width="1.4" stroke-dasharray="6 7"/>
    <ellipse rx="430" ry="138" fill="none" stroke="#1C2433" stroke-width="1.4" stroke-dasharray="3 8"/>

    <circle r="112" fill="url(#r8core)">
      <animate attributeName="r" values="112;122;112" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- wireframe globe -->
    <g filter="url(#r8glow)" stroke="#67E8F9" fill="none">
      <circle r="44" stroke-opacity="0.95" stroke-width="1.8" fill="#080C15" fill-opacity="0.9"/>
      <ellipse rx="44" ry="14" stroke-opacity="0.5" stroke-width="1"/>
      <ellipse rx="44" ry="29" stroke-opacity="0.35" stroke-width="1"/>
      <ellipse rx="17" ry="44" stroke-opacity="0.55" stroke-width="1">
        <animate attributeName="rx" values="5;17;34;44;34;17;5" dur="11s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="34" ry="44" stroke-opacity="0.3" stroke-width="1">
        <animate attributeName="rx" values="43;34;20;5;20;34;43" dur="11s" repeatCount="indefinite"/>
      </ellipse>
      <line x1="-44" y1="0" x2="44" y2="0" stroke-opacity="0.45" stroke-width="1"/>
      <line x1="0" y1="-44" x2="0" y2="44" stroke-opacity="0.45" stroke-width="1"/>
      <circle r="53" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 6">
        <animate attributeName="stroke-dashoffset" values="0;-88" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="Menlo, Consolas, monospace">
      <rect x="-64" y="56" rx="6" width="128" height="40" fill="#0A0E18" stroke="#1C2433" stroke-width="1.2"/>
      <text x="0" y="74" text-anchor="middle" font-size="12" fill="#67E8F9" letter-spacing="3">OPEN</text>
      <text x="0" y="90" text-anchor="middle" font-size="12" fill="#C8D0DC" letter-spacing="3">FRONTIERS</text>
    </g>

    <circle r="4" fill="#E6EAF2" filter="url(#r8glow)">
      <animateMotion path="M300 0 A 300 100 0 1 1 -300 0 A 300 100 0 1 1 300 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.4" fill="#67E8F9">
      <animateMotion path="M430 0 A 430 138 0 1 0 -430 0 A 430 138 0 1 0 430 0" dur="26s" repeatCount="indefinite"/>
    </circle>

    <g font-family="Menlo, Consolas, monospace">
      <g transform="translate(-430 0)">
        <rect x="8" y="-20" rx="6" width="212" height="40" fill="#0A0E18" stroke="#263043" stroke-width="1.2"/>
        <text x="20" y="-4" font-size="12.5" fill="#E6EAF2">01 · sim-to-real</text>
        <text x="20" y="13" font-size="11" fill="#566074">locomotion transfer · mujoco</text>
      </g>
      <g transform="translate(300 0)">
        <rect x="-220" y="-20" rx="6" width="212" height="40" fill="#0A0E18" stroke="#263043" stroke-width="1.2"/>
        <text x="-208" y="-4" font-size="12.5" fill="#E6EAF2">02 · agent determinism</text>
        <text x="-208" y="13" font-size="11" fill="#566074">llm planners · verified control</text>
      </g>
      <g transform="translate(304 96)">
        <rect x="8" y="-20" rx="6" width="230" height="40" fill="#0A0E18" stroke="#263043" stroke-width="1.2"/>
        <text x="20" y="-4" font-size="12.5" fill="#E6EAF2">03 · local inference</text>
        <text x="20" y="13" font-size="11" fill="#566074">kv-cache · apple silicon loops</text>
      </g>
    </g>
  </g>
</svg>
