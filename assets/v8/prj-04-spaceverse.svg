<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="PRJ-04 SpaceVerse — phone-first 3D celestial physics sandbox">
  <defs>
    <linearGradient id="p4bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E18"/><stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="p4r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.85"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0.08"/>
    </linearGradient>
