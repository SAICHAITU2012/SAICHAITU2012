  <g stroke="#67E8F9" fill="none" stroke-width="1.8" opacity="0.85">
    <ellipse cx="150" cy="176" rx="62" ry="24" transform="rotate(-14 150 176)" stroke-dasharray="6 6" stroke-opacity="0.5"/>
