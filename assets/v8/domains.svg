<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-label="Core engineering domains — four precision cards over a faint holographic grid: embodied AI, swarms and local LLM planners, sovereign air-gapped systems, spatial 3D and core systems">
  <defs>
    <linearGradient id="dmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="dmCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B101C"/>
      <stop offset="1" stop-color="#080C15"/>
    </linearGradient>
    <linearGradient id="dmSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070D"/>
      <stop offset="1" stop-color="#02040A"/>
    </linearGradient>
    <linearGradient id="dmRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="dmGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="440" fill="url(#dmSky)"/>

  <g font-family="Menlo, Consolas, monospace">
    <text x="40" y="34" font-size="11" fill="#67E8F9" letter-spacing="3">// CORE SPECIALIZATION DOMAINS</text>
    <text x="1560" y="34" text-anchor="end" font-size="9.5" fill="#566074" letter-spacing="1.5">SIM-TO-REAL · DETERMINISTIC VERIFICATION</text>
  </g>

  <!-- ════ CARD 01 ════ -->
  <g transform="translate(40 62)">
    <rect x="6" y="6" width="330" height="254" rx="10" fill="url(#dmSide)"/>
    <rect width="330" height="254" rx="10" fill="url(#dmCard)" stroke="#1C2433" stroke-width="1.2"/>
    <text x="212" y="96" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="88" font-weight="200" fill="#67E8F9" fill-opacity="0.07">01</text>
    <g font-family="Menlo, Consolas, monospace">
      <text x="26" y="34" font-size="11" fill="#67E8F9" letter-spacing="2">01 // EMBODIED AI</text>
      <rect x="26" y="46" width="52" height="1.5" fill="url(#dmRule)"/>
      <text x="26" y="78" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#E6EAF2" letter-spacing="0.5">Robotics &amp; RL Simulation</text>
      <text x="26" y="102" font-size="11.5" fill="#8B96AB">PPO training, LfD teleoperation and</text>
      <text x="26" y="118" font-size="11.5" fill="#8B96AB">physics-accurate humanoid &amp; swarm sim.</text>
      <g font-size="10">
        <rect x="26" y="136" width="94" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="34" y="150" fill="#C8D0DC">Genesis World</text>
        <rect x="126" y="136" width="82" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="134" y="150" fill="#C8D0DC">MuJoCo 3.17</text>
        <rect x="26" y="162" width="78" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="34" y="176" fill="#C8D0DC">Unitree G1</text>
        <rect x="110" y="162" width="62" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="118" y="176" fill="#C8D0DC">PyTorch</text>
      </g>
      <text x="26" y="212" font-size="10.5" fill="#67E8F9">2/2 payload drops @ 0.547 m precision</text>
      <text x="26" y="232" font-size="9.5" fill="#566074">genesis world v1.4.5 · apple m4 silicon</text>
    </g>
  </g>

  <!-- ════ CARD 02 ════ -->
  <g transform="translate(434 62)">
    <rect x="6" y="6" width="330" height="254" rx="10" fill="url(#dmSide)"/>
    <rect width="330" height="254" rx="10" fill="url(#dmCard)" stroke="#1C2433" stroke-width="1.2"/>
    <text x="212" y="96" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="88" font-weight="200" fill="#67E8F9" fill-opacity="0.07">02</text>
    <g font-family="Menlo, Consolas, monospace">
      <text x="26" y="34" font-size="11" fill="#67E8F9" letter-spacing="2">02 // SWARMS + LLM</text>
      <rect x="26" y="46" width="52" height="1.5" fill="url(#dmRule)"/>
      <text x="26" y="78" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#E6EAF2" letter-spacing="0.5">Autonomous Multi-Agent</text>
      <text x="26" y="102" font-size="11.5" fill="#8B96AB">Local LLM commanders plan over learned</text>
      <text x="26" y="118" font-size="11.5" fill="#8B96AB">skills — deterministic rule arbitration.</text>
      <g font-size="10">
        <rect x="26" y="136" width="72" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="34" y="150" fill="#C8D0DC">Qwen 2.5</text>
        <rect x="104" y="136" width="58" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="112" y="150" fill="#C8D0DC">Ollama</text>
        <rect x="26" y="162" width="70" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="34" y="176" fill="#C8D0DC">Local RAG</text>
        <rect x="102" y="162" width="84" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="110" y="176" fill="#C8D0DC">Shared Memory</text>
      </g>
      <text x="26" y="212" font-size="10.5" fill="#67E8F9">on-device planning loop · json task specs</text>
      <text x="26" y="232" font-size="9.5" fill="#566074">deterministic arbitration · verified control</text>
    </g>
  </g>

  <!-- ════ CARD 03 ════ -->
  <g transform="translate(828 62)">
    <rect x="6" y="6" width="330" height="254" rx="10" fill="url(#dmSide)"/>
    <rect width="330" height="254" rx="10" fill="url(#dmCard)" stroke="#1C2433" stroke-width="1.2"/>
    <text x="212" y="96" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="88" font-weight="200" fill="#67E8F9" fill-opacity="0.07">03</text>
    <g font-family="Menlo, Consolas, monospace">
      <text x="26" y="34" font-size="11" fill="#67E8F9" letter-spacing="2">03 // SOVEREIGN AI</text>
      <rect x="26" y="46" width="52" height="1.5" fill="url(#dmRule)"/>
      <text x="26" y="78" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#E6EAF2" letter-spacing="0.5">Air-Gapped Workbenches</text>
      <text x="26" y="102" font-size="11.5" fill="#8B96AB">Confidential industrial inference with</text>
      <text x="26" y="118" font-size="11.5" fill="#8B96AB">zero outbound traffic — 100% on-device.</text>
      <g font-size="10">
        <rect x="26" y="136" width="62" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="34" y="150" fill="#C8D0DC">FastAPI</text>
        <rect x="94" y="136" width="56" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="102" y="150" fill="#C8D0DC">Docker</text>
        <rect x="26" y="162" width="84" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="34" y="176" fill="#C8D0DC">Vector Store</text>
        <rect x="116" y="162" width="46" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="124" y="176" fill="#C8D0DC">Ollama</text>
      </g>
      <text x="26" y="212" font-size="10.5" fill="#67E8F9">outbound: 0 bytes · socket-level block</text>
      <text x="26" y="232" font-size="9.5" fill="#566074">sih26117 · mangalore refinery specs</text>
    </g>
  </g>

  <!-- ════ CARD 04 ════ -->
  <g transform="translate(1222 62)">
    <rect x="6" y="6" width="330" height="254" rx="10" fill="url(#dmSide)"/>
    <rect width="330" height="254" rx="10" fill="url(#dmCard)" stroke="#1C2433" stroke-width="1.2"/>
    <text x="212" y="96" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="88" font-weight="200" fill="#67E8F9" fill-opacity="0.07">04</text>
    <g font-family="Menlo, Consolas, monospace">
      <text x="26" y="34" font-size="11" fill="#67E8F9" letter-spacing="2">04 // SPATIAL 3D + SYSTEMS</text>
      <rect x="26" y="46" width="52" height="1.5" fill="url(#dmRule)"/>
      <text x="26" y="78" font-family="'Avenir Next','Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#E6EAF2" letter-spacing="0.5">Worlds &amp; Core Systems</text>
      <text x="26" y="102" font-size="11.5" fill="#8B96AB">WebGL gravity sandboxes, POSIX shells,</text>
      <text x="26" y="118" font-size="11.5" fill="#8B96AB">full-stack TypeScript architectures.</text>
      <g font-size="10">
        <rect x="26" y="136" width="62" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="34" y="150" fill="#C8D0DC">Three.js</text>
        <rect x="94" y="136" width="46" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="102" y="150" fill="#C8D0DC">R3F</text>
        <rect x="26" y="162" width="46" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="34" y="176" fill="#C8D0DC">Expo</text>
        <rect x="78" y="162" width="52" height="20" rx="4" fill="#0D1320" stroke="#263043"/>
        <text x="86" y="176" fill="#C8D0DC">C++17</text>
      </g>
      <text x="26" y="212" font-size="10.5" fill="#67E8F9">60 fps celestial render on mobile</text>
      <text x="26" y="232" font-size="9.5" fill="#566074">posix conformance suite · codecrafters</text>
    </g>
  </g>

  <!-- single data conduit -->
  <line x1="200" y1="330" x2="1400" y2="330" stroke="#263043" stroke-width="1.2"/>
  <circle r="3" fill="#67E8F9">
    <animateMotion path="M200 330 L1400 330" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- faint perspective floor -->
  <rect y="348" width="1600" height="92" fill="#04060B"/>
  <line x1="0" y1="348" x2="1600" y2="348" stroke="#67E8F9" stroke-opacity="0.1" stroke-width="1"/>
  <g stroke="#67E8F9" stroke-opacity="0.1" stroke-width="1">
    <line x1="800" y1="348" x2="520" y2="440"/>
    <line x1="800" y1="348" x2="1080" y2="440"/>
    <line x1="800" y1="348" x2="240" y2="440"/>
    <line x1="800" y1="348" x2="1360" y2="440"/>
    <line x1="800" y1="348" x2="800" y2="440"/>
  </g>
  <line x1="0" y1="392" x2="1600" y2="392" stroke="url(#dmGrid)" stroke-width="1"/>
</svg>
