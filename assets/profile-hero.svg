<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Krishna Chaitanya — software, systems and curious ideas</title>
  <desc id="desc">A midnight-blue technical landscape with orbital lines, a luminous horizon and a constellation-like network of software systems.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="1110" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset=".56" stop-color="#0A1B2B"/>
      <stop offset="1" stop-color="#11102A"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#19D3C5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#19D3C5"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="760" y1="40" x2="1160" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19D3C5" stop-opacity=".72"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 170 -310 0 960 190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19D3C5" stop-opacity=".15"/>
      <stop offset="1" stop-color="#19D3C5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#9EB8CB" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur" x="760" y="25" width="440" height="325" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="0" y="0" width="1200" height="360" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <ellipse cx="978" cy="181" rx="176" ry="96" fill="#19D3C5" fill-opacity=".13" filter="url(#blur)"/>

  <g opacity=".58" stroke="url(#orbit)">
    <ellipse cx="970" cy="183" rx="244" ry="85" transform="rotate(-24 970 183)" stroke-width="1.4"/>
    <ellipse cx="970" cy="183" rx="198" ry="129" transform="rotate(29 970 183)" stroke-width="1.2"/>
    <ellipse cx="970" cy="183" rx="157" ry="183" transform="rotate(70 970 183)" stroke-width="1"/>
  </g>
  <g stroke="#7B94AA" stroke-opacity=".28" stroke-width="1">
    <path d="m814 107 93 53 91-31 107 57"/>
    <path d="m855 260 52-100 90 84 48-115"/>
    <path d="m998 129-1 115"/>
    <path d="m907 160 91 84 107-58"/>
  </g>
  <g fill="#19D3C5">
    <circle cx="814" cy="107" r="3"/><circle cx="907" cy="160" r="4"/>
    <circle cx="998" cy="129" r="3"/><circle cx="1105" cy="186" r="4"/>
    <circle cx="855" cy="260" r="3"/><circle cx="998" cy="244" r="4"/>
  </g>
  <circle cx="998" cy="186" r="34" fill="#19D3C5" fill-opacity=".09" filter="url(#soft)"/>
  <circle cx="998" cy="186" r="7" fill="#C8FFF8"/>
  <circle cx="998" cy="186" r="3.2" fill="#19D3C5"/>

  <path d="M72 284H1128" stroke="url(#horizon)" stroke-width="1"/>
  <path d="M72 284H504" stroke="#19D3C5" stroke-opacity=".5" stroke-width="1"/>
  <text x="76" y="92" fill="#19D3C5" font-family="monospace" font-size="13" letter-spacing="3">STUDENT DEVELOPER  /  SYSTEMS THINKER</text>
  <text x="72" y="164" fill="#F2F7FC" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8">Krishna Chaitanya</text>
  <text x="76" y="207" fill="#C4D1DF" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing=".15">I build AI tools, interactive worlds, and software with a point of view.</text>
  <g font-family="monospace" font-size="12" letter-spacing="1.1">
    <text x="76" y="322" fill="#98AABD">AGENTIC AI</text>
    <circle cx="166" cy="318" r="2" fill="#19D3C5"/>
    <text x="183" y="322" fill="#98AABD">LOCAL-FIRST SYSTEMS</text>
    <circle cx="352" cy="318" r="2" fill="#19D3C5"/>
    <text x="369" y="322" fill="#98AABD">INTERACTIVE 3D</text>
  </g>
  <text x="1125" y="322" fill="#62788E" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="1.5">BUILD / LEARN / REPEAT</text>
</svg>